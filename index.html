<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio · Harsh Kumar</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap">
<style>
  :root{
    --bg:#ecebe8; --bar:#f6f5f2; --ink:#3a3a3a; --mute:#8a8a87; --line:#d9d8d4; --accent:#222;
    --barh:52px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1c1c; --bar:#242424; --ink:#e4e4e1; --mute:#8e8e8a; --line:#363636; --accent:#fff; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Satoshi","Jost","Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

  /* top bar */
  .bar{position:fixed;inset:0 0 auto 0;height:var(--barh);display:flex;align-items:center;gap:6px;
    padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right));
    background:var(--bar);border-bottom:1px solid var(--line);z-index:20;letter-spacing:.02em}
  .title{font-size:15px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title b{font-weight:400}
  .title span{color:var(--mute);margin-left:8px}
  .btn{font-size:13px;padding:7px 11px;border-radius:999px;color:var(--mute);transition:color .15s,background .15s;white-space:nowrap}
  .btn:hover{color:var(--accent);background:rgba(127,127,127,.12)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .btn[aria-pressed="true"]{color:var(--accent);background:rgba(127,127,127,.16)}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .sep{width:1px;height:18px;background:var(--line);margin:0 6px}
  .count{font-size:13px;color:var(--mute);min-width:72px;text-align:center;font-variant-numeric:tabular-nums}

  /* flipbook view */
  .stage{position:fixed;inset:var(--barh) 0 0 0;display:flex;align-items:center;justify-content:center;padding:24px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #book{max-width:100%;max-height:100%}
  .page{background:#fff;overflow:hidden}
  .page img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;color:var(--mute);background:var(--bar);border:1px solid var(--line);z-index:10;
    transition:color .15s,opacity .2s}
  .nav:hover{color:var(--accent)}
  .nav.l{left:14px}.nav.r{right:14px}
  .nav[disabled]{opacity:0;pointer-events:none}
  .nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}

  /* scroll view */
  .scroll{position:fixed;inset:var(--barh) 0 0 0;overflow-y:auto;overflow-x:hidden;display:none;padding:28px 20px 60px;scroll-behavior:smooth}
  .scroll.on{display:block}
  .spread{display:flex;justify-content:center;margin:0 auto 28px;max-width:1500px;box-shadow:0 1px 14px rgba(0,0,0,.12);background:#fff}
  .spread.single{max-width:750px}
  .spread img{display:block;width:50%;height:auto;min-width:0}
  .spread.single img{width:100%}
  .lbl{max-width:1500px;margin:0 auto 8px;font-size:12px;color:var(--mute);letter-spacing:.04em}

  /* zoom overlay */
  .zoom{position:fixed;inset:var(--barh) 0 0 0;background:#141414;z-index:15;display:none;overflow:hidden;touch-action:none;cursor:grab}
  .zoom.on{display:block}.zoom.drag{cursor:grabbing}
  #zinner{position:absolute;left:0;top:0;display:flex;transform-origin:0 0;will-change:transform;background:#fff}
  #zinner img{display:block;width:2539px;height:2539px;flex:none;max-width:none}
  .zbar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:var(--bar);border:1px solid var(--line);border-radius:999px;padding:4px;z-index:3}
  .zinfo{position:absolute;left:12px;top:12px;font-size:12px;color:#d6d6d3;pointer-events:none;letter-spacing:.04em;background:rgba(18,18,18,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 13px;max-width:calc(100% - 260px);z-index:2}
  /* "you are here" key map, top right of the zoom view */
  .zmap{position:absolute;top:12px;right:12px;z-index:2;background:rgba(18,18,18,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px;pointer-events:none;color:#d6d6d3;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  .zmapin{position:relative;height:96px;overflow:hidden;border-radius:4px;background:#fff}
  .zimgs{display:flex;height:100%}
  .zimgs img{display:block;height:96px;width:96px;flex:none}
  .zvp{position:absolute;border:1.5px solid #fff;box-sizing:border-box;border-radius:2px;
    box-shadow:0 0 0 400px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.45)}
  .zcap{font-size:11px;text-align:center;margin-top:6px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .spread{cursor:zoom-in}

  /* bottom page dock: hover the bottom edge and it slides up */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:14;pointer-events:none;display:flex;flex-direction:column;align-items:center;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .dock-hit{pointer-events:auto;width:100%;height:22px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;flex:none}
  .dock-hit span{width:64px;height:4px;border-radius:4px;background:var(--mute);opacity:.5;transition:opacity .2s,width .25s}
  .dock-hit:hover span,.dock.open .dock-hit span{opacity:.9;width:84px}
  .dock-panel{pointer-events:auto;width:min(940px,calc(100% - 16px));border:1px solid var(--line);border-radius:16px;
    background:var(--bar);background:color-mix(in srgb,var(--bar) 90%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 8px 30px rgba(0,0,0,.2);transform:translateY(calc(100% + 30px));opacity:0;visibility:hidden;
    transition:transform .3s cubic-bezier(.2,.85,.25,1),opacity .2s,visibility 0s .3s;overflow:hidden}
  .dock.open .dock-panel{transform:none;opacity:1;visibility:visible;transition:transform .3s cubic-bezier(.2,.85,.25,1),opacity .2s,visibility 0s}
  .dock-top{display:flex;align-items:center;gap:14px;padding:11px 18px 0}
  .dock-lbl{font-size:12px;letter-spacing:.05em;color:var(--mute);min-width:112px;font-variant-numeric:tabular-nums;white-space:nowrap}
  #dkRange{flex:1;min-width:0;margin:0;height:18px;accent-color:var(--accent)}
  .dock-strip{position:relative;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:38px 30px 12px;scrollbar-width:none}
  .dock-strip::-webkit-scrollbar{display:none}
  .dk{flex:none;position:relative;width:48px;height:48px;border-radius:5px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);
    transform-origin:50% 100%;transition:transform .12s ease-out;outline:2px solid transparent;outline-offset:2px}
  .dk img{display:block;width:100%;height:100%;border-radius:5px;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
  .dk i{position:absolute;left:3px;bottom:2px;font-family:inherit;font-weight:500;font-size:9px;line-height:1;font-style:normal;color:#fff;text-shadow:0 0 2px #000,0 0 3px #000;pointer-events:none}
  .dk.cur{outline-color:var(--accent)}
  body[data-view="3d"] .dock,body.zooming .dock{display:none}
  /* 3D mockup view */
  .mock{position:fixed;inset:var(--barh) 0 0 0;display:none;overflow:hidden;touch-action:none;cursor:grab;
    background:radial-gradient(ellipse at 50% 42%,var(--m1) 0%,var(--m2) 70%)}
  .mock{--m1:#f4f3f0;--m2:#dedcd7}
  @media (prefers-color-scheme: dark){ .mock{--m1:#2b2b2b;--m2:#161616} }
  .mock.on{display:block}
  .mock.drag{cursor:grabbing}
  .scene{position:absolute;left:50%;top:46%;width:0;height:0;perspective:2600px}
  .rig{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
  .bk{position:absolute;transform-style:preserve-3d;left:calc(var(--W) / -2);top:calc(var(--H) / -2);width:var(--W);height:var(--H)}
  .bk .f{position:absolute;backface-visibility:hidden;overflow:hidden;background:#fff}
  .bk canvas{display:block;width:100%;height:100%}
  .bk .front{inset:0;transform:translateZ(calc(var(--D) / 2))}
  .bk .back{inset:0;transform:rotateY(180deg) translateZ(calc(var(--D) / 2))}
  .bk .spine{width:var(--D);height:var(--H);left:calc(var(--D) / -2);top:0;transform:rotateY(-90deg) translateZ(0) ;transform-origin:50% 50%}
  .bk .paper{background-color:#f3f1ea}
  .bk .fore{width:calc(var(--D) - var(--b) * 2);height:calc(var(--H) - var(--i) * 2);left:calc(var(--W) - (var(--D) - var(--b) * 2) / 2);top:var(--i);
    transform:rotateY(90deg) translateZ(calc(var(--i) * -1));
    background-image:repeating-linear-gradient(90deg,#f6f4ee 0 1.2px,#d9d5c9 1.2px 2.4px)}
  .bk .top{width:calc(var(--W) - var(--i)); height:calc(var(--D) - var(--b) * 2);left:0;top:calc(var(--H) / 2 - (var(--D) - var(--b) * 2) / 2);
    transform:rotateX(90deg) translateZ(calc(var(--H) / 2 - var(--i)));
    background-image:repeating-linear-gradient(0deg,#f6f4ee 0 1.2px,#d9d5c9 1.2px 2.4px)}
  .bk .bot{width:calc(var(--W) - var(--i)); height:calc(var(--D) - var(--b) * 2);left:0;top:calc(var(--H) / 2 - (var(--D) - var(--b) * 2) / 2);
    transform:rotateX(-90deg) translateZ(calc(var(--H) / 2 - var(--i)));
    background-image:repeating-linear-gradient(0deg,#f6f4ee 0 1.2px,#d9d5c9 1.2px 2.4px)}
  .bk .shade{position:absolute;inset:0;pointer-events:none}
    .bk .front .shade{background:none}
    .bk .back .shade{background:none}
    .bk .spine .shade{background:none}
  .bk .fore,.bk .top,.bk .bot{box-shadow:inset 0 0 14px rgba(0,0,0,.16)}
  .floor{position:absolute;left:50%;width:70vmin;height:9vmin;transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(0,0,0,.34) 0%,rgba(0,0,0,.12) 45%,rgba(0,0,0,0) 72%);filter:blur(10px);pointer-events:none}
  .mockbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;
    background:var(--bar);border:1px solid var(--line);z-index:3}
  .mockhint{position:absolute;left:0;right:0;bottom:78px;text-align:center;font-size:12px;letter-spacing:.06em;color:var(--mute);pointer-events:none}
  .mock.clean .mockbar,.mock.clean .mockhint{display:none}
  body.clean .bar{display:none}
  body.clean .mock{inset:0}

  .loading{position:fixed;inset:var(--barh) 0 0 0;display:grid;place-items:center;color:var(--mute);font-size:14px;letter-spacing:.08em;pointer-events:none;transition:opacity .4s}
  .loading.off{opacity:0}

  @media (max-width:640px){
    .title span{display:none}
    .btn{padding:7px 8px;font-size:12px}
    .sep{margin:0 2px}
    .nav{display:none}
    .stage{padding:12px}
    .hide-sm{display:none}
    .zinfo{display:none}
    .zmap{top:8px;right:8px}
    .dk{width:42px;height:42px}
    .dock-lbl{min-width:84px}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="title"><b>Portfolio</b><span>Harsh Kumar · 2023–2026</span></div>
  <button class="btn" id="prev" aria-label="Previous page">Prev</button>
  <span class="count" id="count" aria-live="polite">1 / 48</span>
  <button class="btn" id="next" aria-label="Next page">Next</button>
  <span class="sep"></span>
  <button class="btn" id="zoom" aria-label="Zoom current pages">Zoom</button>
  <button class="btn" id="vflip" aria-pressed="true">Flipbook</button>
  <button class="btn" id="vscroll" aria-pressed="false">Scroll</button>
  <button class="btn" id="v3d" aria-pressed="false">3D</button>
  <span class="sep hide-sm"></span>
  <button class="btn hide-sm" id="full">Fullscreen</button>
</header>

<main class="stage" id="stage">
  <div id="book"></div>
</main>
<button class="nav l" id="navl" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nav r" id="navr" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

<section class="scroll" id="scroll" aria-label="Scroll view"></section>
<section class="mock" id="mock" aria-label="3D book mockup">
  <div class="floor" id="floor"></div>
  <div class="scene" id="scene"><div class="rig" id="rig"><div class="bk" id="bk">
    <div class="f paper fore"></div><div class="f paper top"></div><div class="f paper bot"></div>
    <div class="f back"><span class="shade"></span></div>
    <div class="f spine"><span class="shade"></span></div>
    <div class="f front"><span class="shade"></span></div>
  </div></div></div>
  <div class="mockhint">drag to rotate · scroll to zoom</div>
  <div class="mockbar">
    <button class="btn" data-ang="22,-12">Front</button>
    <button class="btn" data-ang="90,-8">Spine</button>
    <button class="btn" data-ang="158,-12">Back</button>
    <button class="btn" data-ang="52,-18">3/4</button>
    <button class="btn" id="spin" aria-pressed="false">Spin</button>
    <button class="btn" id="openbook">Open</button>
  </div>
</section>
<section class="zoom" id="zoomview" aria-label="Zoomed pages"><div id="zinner"></div>
  <div class="zmap" id="zmap" aria-hidden="true"><div class="zmapin" id="zmapin"><div class="zimgs" id="zimgs"></div><div class="zvp" id="zvp"></div></div><div class="zcap" id="zcap"></div></div>
  <div class="zbar"><button class="btn" id="zin">+</button><button class="btn" id="zout">&minus;</button><button class="btn" id="zfit">Fit</button><button class="btn" id="z100">100%</button><button class="btn" id="zclose">Close</button></div><div class="zinfo" id="zinfo"></div></section>
<div class="loading" id="loading">loading…</div>

<div class="dock" id="dock" aria-label="Page navigator">
  <div class="dock-panel" id="dockPanel">
    <div class="dock-top"><span class="dock-lbl" id="dkLbl">Page 1</span><input id="dkRange" type="range" min="1" max="48" value="1" aria-label="Go to page"></div>
    <div class="dock-strip" id="dkStrip"></div>
  </div>
  <div class="dock-hit" id="dockHit" title="Pages"><span></span></div>
</div>

  const zClamp = (sc_, x, y) => {
    const vw = zv.clientWidth, vh = zv.clientHeight, cw = zW * sc_, ch = zH * sc_;
    return [cw <= vw ? (vw - cw) / 2 : Math.min(0, Math.max(vw - cw, x)), ch <= vh ? (vh - ch) / 2 : Math.min(0, Math.max(vh - ch, y))];
  };
  function zApply(){
    zi.style.transform = 'translate(' + zx + 'px,' + zy + 'px) scale(' + zs + ')';
    const vw = zv.clientWidth, vh = zv.clientHeight, cw = zW * zs, ch = zH * zs;
    const l = Math.max(0, -zx / cw), t = Math.max(0, -zy / ch), r = Math.min(1, (vw - zx) / cw), b = Math.min(1, (vh - zy) / ch);
    zvp.style.left = l * 100 + '%'; zvp.style.top = t * 100 + '%';
    zvp.style.width = Math.max(0, r - l) * 100 + '%'; zvp.style.height = Math.max(0, b - t) * 100 + '%';
    zcap.textContent = (zPg[0] === zPg[1] ? 'Page ' + zPg[0] : 'Pages ' + zPg[0] + '–' + zPg[1]) + ' · ' + (zs / zFitScale()).toFixed(1) + '×';
  }
  // cursor position → which part of the page is shown (cursor at the left edge = left edge of the page, etc.)
  function zHover(){
    const vw = zv.clientWidth, vh = zv.clientHeight, cw = zW * tzs, ch = zH * tzs, m = .07;
    const ax = f => Math.max(0, Math.min(1, (f - m) / (1 - 2 * m)));
    tzx = cw <= vw ? (vw - cw) / 2 : -ax(zmx) * (cw - vw);
    tzy = ch <= vh ? (vh - ch) / 2 : -ax(zmy) * (ch - vh);
  }
  function zTick(t){
    zRAF = 0;
    const dt = Math.min(.05, (t - zLast) / 1000 || .016); zLast = t;
    if (!touchMode) zHover();
    const a = 1 - Math.exp(-dt * 13), ds = tzs - zs, dx = tzx - zx, dy = tzy - zy;
    zs += ds * a; zx += dx * a; zy += dy * a;
    const done = Math.abs(ds) < .0004 && Math.abs(dx) < .3 && Math.abs(dy) < .3;
    if (done) { zs = tzs; zx = tzx; zy = tzy; }
    zApply();
    if (!done) zRAF = requestAnimationFrame(zTick);
  }
  const zKick = () => { if (!zRAF && zv.classList.contains('on')) { zLast = performance.now(); zRAF = requestAnimationFrame(zTick); } };
  function zSetScale(ns){
    ns = Math.max(zFitScale(), Math.min(zMax(), ns));
    if (touchMode) {   // touch: keep the centre of the screen steady
      const vw = zv.clientWidth, vh = zv.clientHeight, f = ns / tzs;
      [tzx, tzy] = zClamp(ns, vw / 2 - (vw / 2 - tzx) * f, vh / 2 - (vh / 2 - tzy) * f);
    }
    tzs = ns; zKick();
  }
  function zHint(){
    zinfo.textContent = touchMode ? 'Drag to move · pinch to zoom · double-tap to exit'
                                  : 'Move the cursor to look around · scroll to zoom · double-click to exit';
  }
  const barH = () => (document.querySelector('.bar') || {}).offsetHeight || 0;
  const zPt = e => ({ x: e.clientX, y: e.clientY - barH(), touch: e.pointerType === 'touch' });
  function openZoomPages(a, b, at){
    zPg = [a, b]; zi.innerHTML = ''; zimgs.innerHTML = '';
    zW = 2539 * (b - a + 1); zH = 2539;
    for (let p = a; p <= b; p++) {
      const im = new Image(); im.alt = 'Page ' + p; im.src = PAGES[p - 1];
      const hi = new Image(); hi.onload = () => { im.src = HI[p - 1]; }; hi.src = HI[p - 1]; zi.appendChild(im);
      const th = new Image(); th.alt = ''; th.src = PAGES[p - 1]; zimgs.appendChild(th);
    }
    zmapin.style.width = (96 * (b - a + 1)) + 'px';
    zv.classList.add('on'); document.body.classList.add('zooming'); $('zoom').setAttribute('aria-pressed', 'true');
    const vw = zv.clientWidth, vh = zv.clientHeight, fs = zFitScale();
    zs = fs; zx = (vw - zW * fs) / 2; zy = (vh - zH * fs) / 2;          // start from the whole page ...
    tzs = Math.min(zMax(), fs * 2.8);                                    // ... and ease in
    touchMode = !!(at && at.touch);
    zmx = at ? Math.max(0, Math.min(1, at.x / vw)) : .5; zmy = at ? Math.max(0, Math.min(1, at.y / vh)) : .5;
    if (touchMode) { const f = tzs / zs; [tzx, tzy] = zClamp(tzs, at.x - (at.x - zx) * f, at.y - (at.y - zy) * f); }
    zHint(); zApply(); zKick();
  }
  function openZoom(at){ const [a, b] = spreadOf(flip.getCurrentPageIndex()); openZoomPages(a, b, at); }
  function closeZoom(){
    cancelAnimationFrame(zRAF); zRAF = 0;
    zv.classList.remove('on'); document.body.classList.remove('zooming'); $('zoom').setAttribute('aria-pressed', 'false');
  }
  function toggleZoom(){ if (view !== 'flip') return; zv.classList.contains('on') ? closeZoom() : openZoom(); }
  $('zoom').onclick = () => toggleZoom();
  $('zin').onclick = () => zSetScale(tzs * 1.4);
  $('zout').onclick = () => zSetScale(tzs / 1.4);
  $('zfit').onclick = () => zSetScale(0);
  $('z100').onclick = () => zSetScale(DPR());
  $('zclose').onclick = closeZoom;
  zv.addEventListener('wheel', e => { e.preventDefault(); zSetScale(tzs * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018))); }, { passive: false });
  // mouse / pen: hover to navigate
  zv.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    if (touchMode) { touchMode = false; zHint(); }
    if (e.target.closest('.zbar')) return;                 // don't wander off while reaching for the buttons
    const r = zv.getBoundingClientRect();
    zmx = (e.clientX - r.left) / r.width; zmy = (e.clientY - r.top) / r.height; zKick();
  });
  // touch: drag to pan, pinch to zoom
  const zp = new Map(); let zd = 0;
  zv.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || e.target.closest('.zbar')) return;
    if (!touchMode) { touchMode = true; zHint(); }
    zv.setPointerCapture(e.pointerId); zp.set(e.pointerId, [e.clientX, e.clientY]); zd = 0;
  });
  zv.addEventListener('pointermove', e => {
    if (e.pointerType !== 'touch' || !zp.has(e.pointerId)) return;
    const o = zp.get(e.pointerId); zp.set(e.pointerId, [e.clientX, e.clientY]);
    if (zp.size === 1) { [zx, zy] = zClamp(zs, zx + e.clientX - o[0], zy + e.clientY - o[1]); }
    else if (zp.size === 2) {
      const [p, q] = [...zp.values()], d = Math.hypot(p[0] - q[0], p[1] - q[1]), r = zv.getBoundingClientRect();
      if (zd) {
        const n = Math.max(zFitScale(), Math.min(zMax(), zs * d / zd)), f = n / zs, cx = (p[0] + q[0]) / 2 - r.left, cy = (p[1] + q[1]) / 2 - r.top;
        [zx, zy] = zClamp(n, cx - (cx - zx) * f, cy - (cy - zy) * f); zs = n;
      }
      zd = d;
    }
    tzs = zs; tzx = zx; tzy = zy; zApply();
  });
  const zUp = e => { zp.delete(e.pointerId); zd = 0; };
  zv.addEventListener('pointerup', zUp); zv.addEventListener('pointercancel', zUp);
  tapper(zv, { double: closeZoom, filter: e => !e.target.closest('.zbar') });     // double-tap again to leave
  addEventListener('resize', () => {
    if (!zv.classList.contains('on')) return;
    tzs = Math.max(zFitScale(), Math.min(zMax(), tzs));
    if (touchMode) { [tzx, tzy] = zClamp(tzs, tzx, tzy); zs = tzs; zx = tzx; zy = tzy; zApply(); } else zKick();
  });

  // The flip library listens to the whole window. Keep it out of the loop while zoomed, in other views,
  // or while using the dock, so roaming the cursor can't start a hidden page-curl behind the overlay.
  ['mousedown', 'mousemove', 'mouseup', 'touchstart', 'touchmove', 'touchend'].forEach(t => addEventListener(t, e => {
    if (zv.classList.contains('on') || view !== 'flip' || (e.target.closest && e.target.closest('#dock'))) e.stopPropagation();
  }, true));

  // ---- flipbook: double-tap / double-click a page to zoom. A single tap still turns the page (after a beat).
  const blockRect = () => (book.querySelector('.stf__block') || book).getBoundingClientRect();
  const isPortrait = () => flip.getOrientation && flip.getOrientation() === 'portrait';
  function inCorner(x, y){          // the corner zones belong to the page-curl, so leave them alone
    const r = blockRect(), w = r.width, h = r.height, pw = isPortrait() ? w : w / 2, c = Math.hypot(pw, h) / 5, px = x - r.left, py = y - r.top;
    return (px < c || px > w - c) && (py < c || py > h - c);
  }
  tapper(book, {
    filter: e => view === 'flip' && !zv.classList.contains('on') && !inCorner(e.clientX, e.clientY),
    double: e => openZoom(zPt(e)),
    single: q => {
      if (view !== 'flip' || zv.classList.contains('on')) return;
      const r = blockRect(), f = (q.x - r.left) / r.width;
      (isPortrait() ? f < .35 : f < .5) ? flip.flipPrev() : flip.flipNext();
    }
  });

  // ---- bottom page dock: hover the bottom edge → thumbnails + slider slide up
  const dock = $('dock'), dkStrip = $('dkStrip'), dkRange = $('dkRange'), dkLbl = $('dkLbl');
  const thumbs = []; let curA = 1, curB = 1, hoverIdx = -1, closeT = 0, dkDown = false, dkTouch = false;
  dkRange.max = N;
  PAGES.forEach((src, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'dk'; b.setAttribute('aria-label', 'Go to page ' + (i + 1));
    const im = new Image(); im.src = src.replace('lo/', 'th/'); im.alt = ''; im.draggable = false;
    const n = document.createElement('i'); n.textContent = i + 1;
    b.append(im, n); b.onclick = () => { goPage(i + 1); if (dkTouch) dockClose(0); };
    dkStrip.appendChild(b); thumbs.push(b);
  });
  const lblOf = (a, b) => (a === b ? 'Page ' + a : 'Pages ' + a + '–' + b) + ' / ' + N;
  function centerOn(n, smooth){
    const t = thumbs[n - 1]; if (!t) return;
    dkStrip.scrollTo({ left: t.offsetLeft - dkStrip.clientWidth / 2 + t.offsetWidth / 2, behavior: smooth ? 'smooth' : 'instant' });
  }
  onSync = function(a, b){
    curA = a; curB = b;
    thumbs.forEach((t, i) => t.classList.toggle('cur', i + 1 >= a && i + 1 <= b));
    dkRange.value = a;
    if (hoverIdx < 0 && !dkDown) dkLbl.textContent = lblOf(a, b);
    if (hoverIdx < 0 && !dkDown) centerOn(a, dock.classList.contains('open'));
  };
  onSync(curA, curB);

  function goPage(n){
    n = Math.max(1, Math.min(N, n));
    if (view === 'flip') {
      const [a, b] = spreadOf(flip.getCurrentPageIndex()); if (n >= a && n <= b) return;
      try { flip.flip(n - 1); } catch (e) { go(n); }
      onSync(n, n);
      setTimeout(() => { const [a2, b2] = spreadOf(flip.getCurrentPageIndex()); if (n < a2 || n > b2) go(n); }, 1200);
    } else if (view === 'scroll') {
      const first = n === 1 ? 1 : n === N ? N : (n % 2 === 0 ? n : n - 1);
      const t = sc.querySelector('.lbl[data-first="' + first + '"]');
      if (t) sc.scrollTo({ top: t.offsetTop - 20, behavior: 'smooth' });
    }
  }
  // magnify thumbnails near the cursor, like a dock
  let dkX = 0, edgeV = 0, edgeRAF = 0;
  function dkMagnify(){
    const sr = dkStrip.getBoundingClientRect(); let best = 1e9, bi = -1;
    thumbs.forEach((t, i) => {
      const c = sr.left + t.offsetLeft - dkStrip.scrollLeft + t.offsetWidth / 2, d = dkX - c, k = 1 + .75 * Math.exp(-(d * d) / (2 * 52 * 52));
      t.style.transform = 'scale(' + k.toFixed(3) + ')'; t.style.zIndex = Math.round(k * 10);
      if (Math.abs(d) < best) { best = Math.abs(d); bi = i; }
    });
    hoverIdx = bi; dkLbl.textContent = 'Go to page ' + (bi + 1);
  }
  // hover near the left / right edge of the strip and it glides that way (the mouse wheel still works too)
  function edgeStep(){
    edgeRAF = 0; if (!edgeV) return;
    dkStrip.scrollLeft += edgeV; dkMagnify();
    edgeRAF = requestAnimationFrame(edgeStep);
  }
  dkStrip.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    dkX = e.clientX; dkMagnify();
    const r = dkStrip.getBoundingClientRect(), zone = Math.min(110, r.width / 4), x = e.clientX - r.left;
    edgeV = x < zone ? -Math.pow(1 - x / zone, 1.5) * 16 : x > r.width - zone ? Math.pow(1 - (r.width - x) / zone, 1.5) * 16 : 0;
    if (edgeV && !edgeRAF) edgeRAF = requestAnimationFrame(edgeStep);
  });
  dkStrip.addEventListener('pointerleave', () => {
    edgeV = 0;
    thumbs.forEach(t => { t.style.transform = ''; t.style.zIndex = ''; });
    hoverIdx = -1; if (!dkDown) dkLbl.textContent = lblOf(curA, curB);
  });
  dkStrip.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); dkStrip.scrollLeft += e.deltaY; } }, { passive: false });
  // slider: label follows the thumb while dragging, jump when released
  dkRange.addEventListener('input', () => { const n = +dkRange.value; dkLbl.textContent = 'Go to page ' + n; centerOn(n, false); });
  dkRange.addEventListener('change', () => goPage(+dkRange.value));
  // show / hide
  function dockOpen(){ clearTimeout(closeT); dock.classList.add('open'); centerOn(curA, false); }
  function dockClose(d){ clearTimeout(closeT); closeT = setTimeout(() => { if (!dkDown) dock.classList.remove('open'); }, d == null ? 400 : d); }
  dock.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dockOpen(); });
  dock.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') dockClose(); });
  dock.addEventListener('pointerdown', e => { dkTouch = e.pointerType !== 'mouse'; dkDown = !!e.target.closest('#dkRange'); });
  addEventListener('pointerup', () => { if (dkDown) { dkDown = false; if (!dock.matches(':hover')) dockClose(); } });
  $('dockHit').addEventListener('click', () => { if (dkTouch) dock.classList.contains('open') ? dockClose(0) : dockOpen(); });
  document.addEventListener('pointerdown', e => { if (dock.classList.contains('open') && !e.target.closest('#dock')) dockClose(0); });
  // keep the dock in step with the scroll view
  let scRaf = 0;
  sc.addEventListener('scroll', () => {
    if (scRaf || view !== 'scroll') return;
    scRaf = requestAnimationFrame(() => {
      scRaf = 0;
      const line = sc.scrollTop + sc.clientHeight * .35; let hit = null;
      sc.querySelectorAll('.lbl').forEach(l => { if (l.offsetTop <= line) hit = l; });
      if (hit) { const a = +hit.dataset.first, single = hit.nextElementSibling.classList.contains('single'); onSync(a, single ? a : a + 1); }
    });
  });

  // ---- fullscreen
  function toggleFull(){
    if (!document.fullscreenElement) (document.documentElement.requestFullscreen || (() => {})).call(document.documentElement);
    else document.exitFullscreen();
  }
  $('full').onclick = toggleFull;
  if (!document.documentElement.requestFullscreen) $('full').style.display = 'none';
})();
</script>
</body>
